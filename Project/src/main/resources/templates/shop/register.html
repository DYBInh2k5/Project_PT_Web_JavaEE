<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- REGISTER.HTML - Trang đăng ký tài khoản cho khách hàng mới. Thu thập các thông tin:
     họ tên, tài khoản, mật khẩu, email, địa chỉ, số điện thoại. -->

<head th:replace="~{shop/fragments :: head('Bookora - Register')}"></head>
<body>
<div th:replace="~{shop/fragments :: header}"></div>

<main class="main-content">
    <div class="form-container">
        <h1>Create Account</h1>

        <!-- THÔNG BÁO LỖI: Nếu có biến error trong model (do server trả về sau validate thất bại),
             hiển thị nội dung lỗi động th:text="${error}" -->
        <p th:if="${error != null}" class="error-message" th:text="${error}">Error</p>

        <!-- FORM ĐĂNG KÝ: POST đến /store/register với các trường thông tin khách hàng -->
        <form th:action="@{/store/register}" method="post">
            <div class="form-group">
                <label for="hoTen">Full Name:</label>
                <input type="text" id="hoTen" name="hoTen" required>
            </div>
            <div class="form-group">
                <label for="account">Account:</label>
                <input type="text" id="account" name="account" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="diaChi">Address:</label>
                <input type="text" id="diaChi" name="diaChi">
            </div>
            <div class="form-group">
                <label for="soDienThoai">Phone:</label>
                <input type="text" id="soDienThoai" name="soDienThoai">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <!-- Link dẫn đến trang đăng nhập nếu đã có tài khoản -->
        <p class="form-footer">Already have an account? <a th:href="@{/store/login}">Sign in here</a></p>
    </div>
</main>

<div th:replace="~{shop/fragments :: footer}"></div>
</body>
</html>
