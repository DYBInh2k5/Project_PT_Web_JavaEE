<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shop/fragments :: head('Bookora - Register')}"></head>
<body>
<div th:replace="~{shop/fragments :: header}"></div>

<main class="main-content">
    <div class="form-container">
        <h1>Create Account</h1>
        <p th:if="${error != null}" class="error-message" th:text="${error}">Error</p>
        <form action="/store/register" method="post">
            <div class="form-group">
                <label for="hoTen">Full Name:</label>
                <input type="text" id="hoTen" name="hoTen" required>
            </div>
            <div class="form-group">
                <label for="account">Account:</label>
                <input type="text" id="account" name="account" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="diaChi">Address:</label>
                <input type="text" id="diaChi" name="diaChi">
            </div>
            <div class="form-group">
                <label for="soDienThoai">Phone:</label>
                <input type="text" id="soDienThoai" name="soDienThoai">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="form-footer">Already have an account? <a href="/store/login">Sign in here</a></p>
    </div>
</main>

<div th:replace="~{shop/fragments :: footer}"></div>
</body>
</html>
