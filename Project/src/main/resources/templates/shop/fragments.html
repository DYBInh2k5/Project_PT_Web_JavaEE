<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Bookora</title>
    <link rel="stylesheet" href="/assets/shop-bookora.css">
</head>
<body>
<div th:fragment="header">
    <header class="site-header">
        <div class="header-inner">
            <a href="/store/" class="logo">Bookora</a>
            <nav class="nav-links">
                <a href="/store/">Home</a>
                <a href="/store/my-orders">My Orders</a>
                <a href="/store/order-lookup">Lookup Order</a>
                <a href="/store/cart">Cart</a>
                <div th:if="${session.STORE_CUSTOMER != null}" style="display:flex;gap:1rem;align-items:center">
                    <span style="color:var(--gold)">Welcome, <span th:text="${session.STORE_CUSTOMER.tenKH}">User</span></span>
                    <a href="/store/logout">Logout</a>
                </div>
                <div th:unless="${session.STORE_CUSTOMER != null}">
                    <a href="/store/login">Sign In</a>
                    <a href="/store/register">Register</a>
                </div>
            </nav>
        </div>
    </header>
</div>

<div th:fragment="footer">
    <footer class="site-footer">
        <p>&copy; 2025 Bookora. All rights reserved.</p>
    </footer>
</div>
</body>
</html>
