<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- CHECKOUT.HTML - Trang thanh toán / đặt hàng. Hiển thị tóm tắt đơn hàng (giỏ hàng),
     thông tin khách hàng (từ session), và form nhập địa chỉ giao hàng + ghi chú. -->

<head th:replace="~{shop/fragments :: head('Bookora - Checkout')}"></head>
<body>
<div th:replace="~{shop/fragments :: header}"></div>

<main class="main-content">
    <h1>Checkout</h1>

    <!-- HIỂN THỊ LỖI: Nếu có lỗi (từ redirectAttributes), hiển thị thông báo -->
    <p th:if="${error != null}" class="error-message" th:text="${error}" style="color:#8B0000;background:rgba(139,0,0,0.1);padding:12px 16px;border:1px solid #8B0000;margin-bottom:20px;border-radius:4px"></p>

    <!-- THÔNG BÁO GIỎ TRỐNG: Nếu emptyCart != null, giỏ rỗng không thể checkout -->
    <p th:if="${emptyCart != null}" class="info-message" th:text="${emptyCart}">Your cart is empty</p>

    <!-- KHU VỰC THANH TOÁN: Chỉ hiển thị khi giỏ có hàng -->
    <div th:unless="${emptyCart != null}">
        <!-- Chào khách hàng: Lấy tên từ session.STORE_CUSTOMER.tenKH -->
        <p>Welcome, <strong th:text="${session.STORE_CUSTOMER.tenKH}">Customer</strong></p>

        <!-- BẢNG TÓM TẮT GIỎ HÀNG: Danh sách sản phẩm, đơn giá, số lượng, thành tiền (chỉ đọc, không cho sửa) -->
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <!-- VÒNG LẶP: Duyệt qua cartItems tương tự trang cart nhưng không có nút cập nhật/xóa -->
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.tenSach}">Title</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(item.donGia, 1, 2)}">$0.00</td>
                    <td th:text="${item.soLuong}">1</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(item.donGia * item.soLuong, 1, 2)}">$0.00</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3"><strong>Total</strong></td>
                    <td><strong th:text="'$' + ${#numbers.formatDecimal(total, 1, 2)}">$0.00</strong></td>
                </tr>
            </tfoot>
        </table>

        <!-- FORM ĐẶT HÀNG: POST đến /store/checkout với địa chỉ giao hàng và ghi chú -->
        <form th:action="@{/store/checkout}" method="post">
            <div class="form-group">
                <label for="diaChi">Delivery Address:</label>
                <!-- textarea địa chỉ giao hàng. th:text="${session.STORE_CUSTOMER.diaChi}" điền sẵn
                     địa chỉ của khách hàng từ session, có thể sửa lại -->
                <textarea id="diaChi" name="diaChi" required th:text="${session.STORE_CUSTOMER.diaChi}"></textarea>
            </div>
            <div class="form-group">
                <label for="ghiChu">Note:</label>
                <!-- textarea ghi chú thêm cho đơn hàng (không bắt buộc) -->
                <textarea id="ghiChu" name="ghiChu"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Place Order</button>
            <a th:href="@{/store/cart}" class="btn btn-secondary">Back to Cart</a>
        </form>
    </div>
</main>

<div th:replace="~{shop/fragments :: footer}"></div>
</body>
</html>
