<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shop/fragments :: head('Bookora - Sign In')}"></head>
<body>
<div th:replace="~{shop/fragments :: header}"></div>

<main class="main-content">
    <div class="form-container">
        <h1>Sign In</h1>
        <p th:if="${param.error != null}" class="error-message">Invalid account or password</p>
        <p th:if="${param.registered != null}" class="success-message">Registration successful! Please sign in.</p>
        <form action="/store/login" method="post">
            <div class="form-group">
                <label for="account">Account:</label>
                <input type="text" id="account" name="account" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <p class="form-footer">Don't have an account? <a href="/store/register">Register here</a></p>
    </div>
</main>

<div th:replace="~{shop/fragments :: footer}"></div>
</body>
</html>
