<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- LOGIN.HTML - Trang đăng nhập cho khách hàng. Cho phép khách đã có tài khoản đăng nhập
     bằng tài khoản (account) và mật khẩu (password). -->

<head th:replace="~{shop/fragments :: head('Bookora - Sign In')}"></head>
<body>
<div th:replace="~{shop/fragments :: header}"></div>

<main class="main-content">
    <div class="form-container">
        <h1>Sign In</h1>

        <!-- THÔNG BÁO LỖI: Nếu có tham số error trên URL (do redirect từ server sau đăng nhập thất bại),
             hiển thị thông báo "Invalid account or password" -->
        <p th:if="${param.error != null}" class="error-message">Invalid account or password</p>

        <!-- THÔNG BÁO THÀNH CÔNG: Nếu có tham số registered trên URL (sau khi đăng ký thành công),
             hiển thị thông báo yêu cầu đăng nhập -->
        <p th:if="${param.registered != null}" class="success-message">Registration successful! Please sign in.</p>

        <!-- FORM ĐĂNG NHẬP: POST đến /store/login với các trường account và password -->
        <form th:action="@{/store/login}" method="post">
            <div class="form-group">
                <label for="account">Account:</label>
                <input type="text" id="account" name="account" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <!-- Link dẫn đến trang đăng ký nếu chưa có tài khoản -->
        <p class="form-footer">Don't have an account? <a th:href="@{/store/register}">Register here</a></p>
    </div>
</main>

<div th:replace="~{shop/fragments :: footer}"></div>
</body>
</html>
