<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bookstore MVC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6fb; color: #1f2937; }
        .hero { background: linear-gradient(135deg, #111827, #2563eb); color: white; padding: 32px; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
        .toolbar input, .toolbar select { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
        .card { background: white; border-radius: 18px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); overflow: hidden; }
        .card img { width: 100%; height: 280px; object-fit: cover; display: block; }
        .card .p { padding: 16px; }
        .title { font-weight: 700; font-size: 18px; margin: 0 0 8px; }
        .meta { color: #6b7280; font-size: 14px; margin-bottom: 6px; }
        .price { font-weight: 700; color: #0f766e; }
        .pagination { display: flex; gap: 8px; margin: 24px 0; flex-wrap: wrap; }
        .pagination a { padding: 10px 14px; background: white; border-radius: 10px; text-decoration: none; color: #111827; border: 1px solid #d1d5db; }
        .pagination .active { background: #2563eb; color: white; border-color: #2563eb; }
    </style>
</head>
<body>
<div class="hero">
    <div class="wrap">
        <h1>Bookstore MVC + Thymeleaf</h1>
        <p>Danh sach sach co phan trang, tim kiem va sap xep theo gia.</p>
    </div>
</div>
<div class="wrap">
    <form class="toolbar" method="get" action="/Project/mvc/books">
        <input type="text" name="q" th:value="${keyword}" placeholder="Tim theo ten, tac gia, the loai">
        <select name="sort">
            <option value="newest" th:selected="${sort == 'newest'}">Moi nhat</option>
            <option value="price_asc" th:selected="${sort == 'price_asc'}">Gia tang dan</option>
            <option value="price_desc" th:selected="${sort == 'price_desc'}">Gia giam dan</option>
        </select>
        <select name="size">
            <option value="12" th:selected="${size == 12}">12 / trang</option>
            <option value="24" th:selected="${size == 24}">24 / trang</option>
            <option value="36" th:selected="${size == 36}">36 / trang</option>
        </select>
        <button type="submit">Loc du lieu</button>
    </form>

    <div class="grid">
        <article class="card" th:each="book : ${books}">
            <img th:src="${book.anhBia != null ? book.anhBia : '/assets/seed/book-placeholder.svg'}" alt="Book cover">
            <div class="p">
                <p class="title" th:text="${book.tenSach}">Ten sach</p>
                <div class="meta" th:text="${book.tacGia}">Tac gia</div>
                <div class="meta" th:text="${book.theLoai}">The loai</div>
                <div class="price" th:text="${#numbers.formatDecimal(book.donGia, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</div>
            </div>
        </article>
    </div>

    <div class="pagination" th:if="${totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(1, totalPages)}"
           th:classappend="${i == page} ? 'active'"
           th:href="@{/mvc/books(page=${i}, size=${size}, sort=${sort}, q=${keyword})}"
           th:text="${i}">1</a>
    </div>
</div>
</body>
</html>
